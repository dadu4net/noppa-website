<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Noppa · Social pack</title>
<style>
  body {
    margin: 0; font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    background: #FAFBFD; color: #1A2440;
  }
  header {
    background: linear-gradient(90deg, #00D0F0, #20B0F0, #2060E0, #3A4FD0);
    color: white; padding: 50px 40px;
  }
  header h1 { margin: 0 0 .3em; font-size: 2.2rem; font-weight: 900; }
  header p { margin: 0; opacity: .9; }
  main { max-width: 1200px; margin: 0 auto; padding: 40px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
  }
  .card {
    background: white; border: 1px solid #E4E9F2; border-radius: 14px;
    overflow: hidden; margin: 0;
  }
  .card img { width: 100%; height: auto; display: block; background: #F1F5FB; }
  figcaption {
    padding: 14px 18px; font-size: .85rem; color: #1A2440;
    border-top: 1px solid #E4E9F2;
  }
  figcaption code {
    color: #6B7280; font-size: .75rem;
    background: #F1F5FB; padding: 2px 6px; border-radius: 4px;
  }
  footer { text-align: center; padding: 30px; color: #6B7280; font-size: .8rem; }
</style>
</head>
<body>
<header>
  <h1>Noppa Social Pack</h1>
  <p>Klaar-voor-gebruik templates voor LinkedIn, Instagram, Facebook en stories.</p>
</header>
<main>
  <div class="grid">
    <figure class="card">
      <img src="noppa-social/01-linkedin-post-1200x627.png" alt="01-linkedin-post-1200x627">
      <figcaption><b>linkedin post 1200x627</b><br><code>01-linkedin-post-1200x627.png</code></figcaption>
    </figure>
    <figure class="card">
      <img src="noppa-social/02-linkedin-cover-1584x396.png" alt="02-linkedin-cover-1584x396">
      <figcaption><b>linkedin cover 1584x396</b><br><code>02-linkedin-cover-1584x396.png</code></figcaption>
    </figure>
    <figure class="card">
      <img src="noppa-social/03-instagram-post-1080x1080.png" alt="03-instagram-post-1080x1080">
      <figcaption><b>instagram post 1080x1080</b><br><code>03-instagram-post-1080x1080.png</code></figcaption>
    </figure>
    <figure class="card">
      <img src="noppa-social/04-story-1080x1920.png" alt="04-story-1080x1920">
      <figcaption><b>story 1080x1920</b><br><code>04-story-1080x1920.png</code></figcaption>
    </figure>
    <figure class="card">
      <img src="noppa-social/05-facebook-cover-1640x624.png" alt="05-facebook-cover-1640x624">
      <figcaption><b>facebook cover 1640x624</b><br><code>05-facebook-cover-1640x624.png</code></figcaption>
    </figure>
    <figure class="card">
      <img src="noppa-social/06-quote-card-1080x1080.png" alt="06-quote-card-1080x1080">
      <figcaption><b>quote card 1080x1080</b><br><code>06-quote-card-1080x1080.png</code></figcaption>
    </figure>
    <figure class="card">
      <img src="noppa-social/07-announcement-1200x1200.png" alt="07-announcement-1200x1200">
      <figcaption><b>announcement 1200x1200</b><br><code>07-announcement-1200x1200.png</code></figcaption>
    </figure>
  </div>
</main>
<footer>© 2026 Noppa Solutions &amp; Consultants · Social Pack v1.0</footer>
</body>
</html>
