<style>

.search-Glass{
        /* Glassmorphism look */
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.3);
    padding: 20px;
    border-radius: 10px;
    border-left: 3px solid rgba(255, 255, 255, 0.6);
    border-right: 3px solid rgba(255, 255, 255, 0.6);
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}

/* Container voor de tegels */
.hero-bento-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 200px; /* De hoogte van de kleine tegels */
    gap: 16px;
    padding: 10px 0;
}

/* Standaard opmaak voor alle tegels */
.bento-tile {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: #e1dfdd; 
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: block;
    text-decoration: none;
}

.bento-tile:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
}

/* Afbeelding op de achtergrond */
.bento-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    transition: transform 0.5s ease;
}

.bento-tile:hover .bento-image {
    transform: scale(1.05);
}

/* Donkere verloop/gradient zodat de witte tekst altijd leesbaar is */
.bento-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 70%;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
    z-index: 2;
}

/* De container voor de titel onderaan de tegel */
.bento-content {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 16px;
    z-index: 3;
    box-sizing: border-box;
}

/* Titel styling (standaard kleine tegel) */
.bento-title {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.3;
    color: #ffffff;
    display: -webkit-box;
    -webkit-line-clamp: 2; 
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5); 
}

/* =========================================================
   DYNAMISCHE GRID LAYOUTS OP BASIS VAN AANTAL ITEMS 
   ========================================================= */

/* Als er exact 1 item is (volledige breedte) */
.bento-tile:nth-child(1):nth-last-child(1) { grid-column: span 4; grid-row: span 2; }

/* Als er exact 2 items zijn (helft / helft) */
.bento-tile:nth-child(1):nth-last-child(2) { grid-column: span 2; grid-row: span 2; }
.bento-tile:nth-child(2):nth-last-child(1) { grid-column: span 2; grid-row: span 2; }

/* Als er exact 3 items zijn (Links groot, rechtsboven breed, rechtsonder breed) */
.bento-tile:nth-child(1):nth-last-child(3) { grid-column: span 2; grid-row: span 2; }
.bento-tile:nth-child(2):nth-last-child(2) { grid-column: span 2; grid-row: span 1; }
.bento-tile:nth-child(3):nth-last-child(1) { grid-column: span 2; grid-row: span 1; }

/* Als er exact 4 items zijn (Links groot, rechtsboven breed, onder 2 kleintjes) */
.bento-tile:nth-child(1):nth-last-child(4) { grid-column: span 2; grid-row: span 2; }
.bento-tile:nth-child(2):nth-last-child(3) { grid-column: span 2; grid-row: span 1; }
.bento-tile:nth-child(3):nth-last-child(2) { grid-column: span 1; grid-row: span 1; }
.bento-tile:nth-child(4):nth-last-child(1) { grid-column: span 1; grid-row: span 1; }

/* Als er exact 5 items zijn (Links groot, rechts 4 kleintjes) */
.bento-tile:nth-child(1):nth-last-child(5) { grid-column: span 2; grid-row: span 2; }
.bento-tile:nth-child(2):nth-last-child(4) { grid-column: span 1; grid-row: span 1; }
.bento-tile:nth-child(3):nth-last-child(3) { grid-column: span 1; grid-row: span 1; }
.bento-tile:nth-child(4):nth-last-child(2) { grid-column: span 1; grid-row: span 1; }
.bento-tile:nth-child(5):nth-last-child(1) { grid-column: span 1; grid-row: span 1; }

/* 
  Grotere tekst voor tegels die 2 rijen hoog zijn 
  (Dus het grote linker blok, of beide blokken bij 2 items)
*/
.bento-tile:nth-child(1):nth-last-child(1) .bento-content,
.bento-tile:nth-child(1):nth-last-child(2) .bento-content,
.bento-tile:nth-child(2):nth-last-child(1) .bento-content,
.bento-tile:nth-child(1):nth-last-child(3) .bento-content,
.bento-tile:nth-child(1):nth-last-child(4) .bento-content,
.bento-tile:nth-child(1):nth-last-child(5) .bento-content {
    padding: 24px;
}

.bento-tile:nth-child(1):nth-last-child(1) .bento-title,
.bento-tile:nth-child(1):nth-last-child(2) .bento-title,
.bento-tile:nth-child(2):nth-last-child(1) .bento-title,
.bento-tile:nth-child(1):nth-last-child(3) .bento-title,
.bento-tile:nth-child(1):nth-last-child(4) .bento-title,
.bento-tile:nth-child(1):nth-last-child(5) .bento-title {
    font-size: 26px;
}

/* Responsiviteit: Op mobiel zetten we ze allemaal onder elkaar */
@media (max-width: 768px) {
    .hero-bento-grid {
        grid-template-columns: 1fr;
        grid-auto-rows: 250px;
    }
    /* Overschrijf alle dynamische grid spans voor mobiel */
    .bento-tile {
        grid-column: 1 !important;
        grid-row: span 1 !important;
    }
}
</style>
<div class="search-Glass">
<div class="template_root">
    {{#if @root.data.items}}
        <div class="hero-bento-grid">
            {{#each @root.data.items as |item|}}
                
                <!-- Let op: geen index classes meer nodig! CSS telt het aantal items -->
                <a href="{{item.DefaultEncodingURL}}" class="bento-tile">
                    
                    {{#if item.AutoPreviewImageUrl}}
                        <img src="{{item.AutoPreviewImageUrl}}" class="bento-image" alt="{{item.Title}}"/>
                    {{/if}}
                    
                    <div class="bento-overlay"></div>
                    
                    <div class="bento-content">
                        <h3 class="bento-title">{{item.Title}}</h3>
                    </div>

                </a>

            {{/each}}
        </div>
    {{else}}
        <p>Er zijn momenteel geen artikelen.</p>
    {{/if}}
</div>
</div>
